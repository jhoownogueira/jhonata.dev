name: jhonata-dev

services:
  site:
    image: jhonata-dev:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${SITE_BIND_ADDRESS:-0.0.0.0}:${SITE_PORT:-3340}:8080'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--output-document=-', 'http://localhost:8080/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
