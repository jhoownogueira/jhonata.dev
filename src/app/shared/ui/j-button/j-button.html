@if (href && !disabled) { @if (isInternalRoute) {
<a
  pRipple
  class="j-button"
  [class]="'j-button j-button--' + variant"
  [routerLink]="href"
  [attr.aria-label]="ariaLabel ?? label"
>
  <span>{{ label }}</span>
  @if (icon) {
  <i [class]="icon" aria-hidden="true"></i>
  }
</a>
} @else {
<a
  pRipple
  class="j-button"
  [class]="'j-button j-button--' + variant"
  [href]="href"
  [target]="target"
  [attr.rel]="target === '_blank' ? 'noopener noreferrer' : null"
  [attr.download]="download ?? null"
  [attr.aria-label]="ariaLabel ?? label"
>
  <span>{{ label }}</span>
  @if (icon) {
  <i [class]="icon" aria-hidden="true"></i>
  }
</a>
} } @else {
<button
  pRipple
  type="button"
  [class]="'j-button j-button--' + variant"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel ?? label"
  (click)="pressed.emit()"
>
  <span>{{ label }}</span>
  @if (icon) {
  <i [class]="icon" aria-hidden="true"></i>
  }
</button>
}
