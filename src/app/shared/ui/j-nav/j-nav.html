<header class="site-header">
  <div class="nav-shell">
    <a class="brand" href="#top" [attr.aria-label]="language.ui().brandHome">
      <img src="assets/brand/icon-logo.png" alt="" width="28" height="36" />
      <span>jhonata<span class="brand-dot">.</span>dev</span>
    </a>

    <nav class="desktop-nav" [attr.aria-label]="language.ui().mainNavigation">
      @for (item of items; track item.href) {
      <a [href]="item.href">{{ item.label }}</a>
      }
    </nav>

    <div class="nav-actions">
      <j-language-select />
      <j-theme-toggle />
      <button
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="open()"
        aria-controls="mobile-menu"
        [attr.aria-label]="language.ui().openMenu"
        (click)="toggle()"
      >
        <span></span><span></span>
      </button>
    </div>
  </div>

  @if (open()) {
  <nav id="mobile-menu" class="mobile-nav" [attr.aria-label]="language.ui().mobileNavigation">
    @for (item of items; track item.href; let index = $index) {
    <a [href]="item.href" (click)="close()">
      <span>0{{ index + 1 }}</span>{{ item.label }}<i class="pi pi-arrow-up-right"></i>
    </a>
    }
  </nav>
  }
</header>
