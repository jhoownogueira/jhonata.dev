<button
  type="button"
  class="theme-toggle"
  [attr.aria-label]="theme.isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
  [attr.title]="theme.isDark() ? 'Tema claro' : 'Tema escuro'"
  (click)="theme.toggle()"
>
  <i [class]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'" aria-hidden="true"></i>
</button>
